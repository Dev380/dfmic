[workspace]
resolver = "2"
members = ["crates/dfn-dsp", "crates/dfn-npu", "crates/dfmic"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
dfn-dsp = { path = "crates/dfn-dsp" }
dfn-npu = { path = "crates/dfn-npu" }
num-complex = "0.4"
realfft = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
